<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tree Visualization</title>
    <link rel="stylesheet" href="style.css">
</head>

    <body>
        
        <Header>
            <h1>Binary Tree and Graph Visualizer</h1>
        </Header>

        <section class="Container">
            <section class="Main">
                <p>Enter Nodes: </p>
                <textarea id="Nodes" placeholder="Enter tree node eg:-1,2,3 or 1 2 3"></textarea>
                <p id="count">The number of tree nodes: </p>
                <button>Submit</button>
                <button>Reset</button>
                <p>Input type: Binary Tree</p>
            </section>
        </section>

    </body>

    <script src="script.js"></script>

</html>
