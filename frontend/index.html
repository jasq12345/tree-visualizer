<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tree Visualization</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Binary Tree and Graph Visualizer</h1>
    </header>

    <section class="Container">
      <section class="Main">
        <p class="FieldLabel">Enter Nodes:</p>
        <textarea id="textarea" placeholder="Enter tree node eg:-1,2,3 or 1 2 3"></textarea>
        <p id="count">The number of tree nodes: 0</p>

        <div class="Row">
          <div class="Group">
            <button id="submit-btn" class="Button1">Submit</button>
            <button id="reset-btn" class="Button2">Reset</button>
          </div>
          <div class="Group">
            <label for="input-type">Input type:</label>
            <select id="input-type">
              <option value="bst">Binary Search Tree</option>
            </select>
          </div>
        </div>

        <div class="Row AlgoRow">
          <div class="Group">
            <select id="algorithm"></select>
            <input type="number" id="target" placeholder="Target" hidden />
            <button id="run-btn" class="Button1">Run</button>
            <button id="play-btn" class="Button2" disabled>Play</button>
            <button id="next-btn" class="Button2" disabled>Next</button>
          </div>
          <div class="Group">
            <label for="speed">Speed:</label>
            <input type="range" id="speed" min="1" max="10" value="5" />
          </div>
        </div>

        <div id="steps" class="Steps"></div>
        <p id="result" class="Result"></p>
        <p id="error" class="Error" hidden></p>
      </section>
    </section>

    <section class="Workspace">
      <section class="Code">
        <div class="CodeHeader">
          <div class="CodeTitle">
            <span class="FileName">algorithm.py</span>
            <span class="Badge">PYTHON</span>
          </div>
          <div class="Group">
            <input type="number" id="code-target" placeholder="Target" />
            <button id="run-code-btn" class="Button1">Run code</button>
          </div>
        </div>
        <textarea id="code-editor" class="CodeEditor" spellcheck="false">def my_algorithm(tree, target=None):
    steps = []

    def visit(node):
        if node is None:
            return
        steps.append(node.value)
        visit(node.left)
        visit(node.right)

    visit(tree.root)
    return steps, None
</textarea>
        <pre id="code-output" class="CodeOutput"></pre>
      </section>

      <section class="Tree">
        <div class="TreeCanvas">
          <svg id="tree"></svg>
        </div>
        <section class="Settings">
          <button id="download">Hide Settings</button>

          <div class="SettingsRow">
            <label for="orientation">Orientation:</label>
            <select id="orientation">
              <option value="vertical" selected>Vertical</option>
              <option value="horizontal">Horizontal</option>
            </select>

            <label for="nodeShape">Node Shape:</label>
            <select id="nodeShape">
              <option value="circle">Circle</option>
              <option value="square">Square</option>
            </select>

            <label for="linkShape">Link Shape:</label>
            <select id="linkShape">
              <option value="diagonal">Diagonal</option>
              <option value="step">Step</option>
              <option value="straight">Straight</option>
              <option value="elbow">Elbow</option>
            </select>
          </div>

          <div class="SettingsRow">
            <label for="nodeRadius">Node Radius:</label>
            <input type="number" id="nodeRadius" value="13" min="5" max="30" />

            <label for="nodeColor">Node Color:</label>
            <select id="nodeColor">
              <option value="red">Colour</option>
              <option value="green">black&white</option>
            </select>
          </div>
        </section>
      </section>
    </section>

    <script src="script.js"></script>
  </body>
</html>
